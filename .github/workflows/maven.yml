name: Java CI with Maven on javacc-8-java

on:
  push:
    branches: [ release ]
  pull_request:
    branches: [ release ]

jobs:
  build:

    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
       os: [ubuntu-latest, windows-latest, macos-latest]

    steps:

    - name: Clone javacc-8
      uses: actions/checkout@v4
      with:
        repository: javacc/javacc-8.git
        path: javacc-8
        ref: release

    - name: Clone javacc-8-core
      uses: actions/checkout@v4
      with:
        repository: javacc/javacc-8-core.git
        path: javacc-8-core
        ref: release

    - name: Clone javacc-8-java
      uses: actions/checkout@v4
      with:
        repository: javacc/javacc-8-java.git
        path: javacc-8-java
        ref: release

    - name: Display the toolchains configured JDKs
      run: mvn --file javacc-8/pom.xml -ntp --show-version toolchains:display-discovered-jdk-toolchains

    # JDK 8 not found on macos
    - name: Set up JDK 11 for macos only
      if: matrix.os == 'macos-latest'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '11'

    # JDK 8 found on ubuntu
    - name: Set up JDK 8 for ubuntu
      if: matrix.os == 'ubuntu-latest'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '8'

    # JDK 8 & 11 not found on windows
    - name: Set up JDK 17 for windows
      if: matrix.os == 'windows-latest'
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
         path: ~/.m2
         key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
         restore-keys: ${{ runner.os }}-maven-

    # -B: batch mode; -e: produce execution error messages;
    # -X: debug mode; -N: non-recursive (don't build submodules)

    - name: Build install on javacc-8 only
      run: mvn -B -N --file javacc-8/pom.xml                  --show-version install

    - name: Run install on javacc-8-core
      run: mvn -B --file javacc-8-core/pom.xml                --show-version install

    - name: Run install on javacc-8-java skipping integration tests
      run: mvn -B --file javacc-8-java/pom.xml    -P!run-its  --show-version install

    # integration tests run directly (no doNotFailOnError-check-java-issues) (windows)
    - name: Run clean verify on integration tests of javacc-8-java
      if: matrix.os == 'windows-latest'
      run: mvn -B --file javacc-8-java/it/pom.xml -P disp-per --show-version clean verify

    # integration tests run directly (with doNotFailOnError-check-java-issues) (ubuntu, macos)
    - name: Run clean verify on integration tests of javacc-8-java
      if: matrix.os != 'windows-latest'
      run: mvn -B --file javacc-8-java/it/pom.xml -P disp-per,doNotFailOnError-check-java-issues --show-version clean verify

    # integration tests run through Maven Invoker Plugin (no doNotFailOnError-check-java-issues) (windows)
#    - name: Run clean verify on javacc-8-java with integration tests
#      if: matrix.os == 'windows-latest'
#      run: mvn -B --file javacc-8-java/pom.xml    -P disp-per --show-version clean verify

    # integration tests run through Maven Invoker Plugin (ubuntu, macos)
#    - name: Run clean verify on javacc-8-java with integration tests
#      if: matrix.os != 'windows-latest'
#      run: mvn -B --file javacc-8-java/pom.xml    -P disp-per,doNotFailOnError-check-java-issues --show-version clean verify
      